[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "commerce-lab"
version = "0.1.0"
description = "Agentic Commerce Protocol Test Lab: versioned interoperability and failure-testing toolkit for agentic commerce implementations"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
  "fastapi>=0.128,<0.129",
  "starlette>=0.49,<0.50",
  "httpx>=0.28,<0.29",
  "pydantic>=2.13,<3",
  "PyYAML>=6.0,<7",
  "jsonschema>=4.25,<5",
  "cryptography>=45,<51",
  "uvicorn>=0.39,<0.40",
]

[project.optional-dependencies]
dev = ["pytest>=8.4,<9"]

[project.scripts]
commerce-lab = "lab.cli.main:main"

[tool.setuptools]
packages = { find = { include = ["lab*", "drivers*", "fixtures*", "fault_proxy*", "reference_targets*"] } }

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
