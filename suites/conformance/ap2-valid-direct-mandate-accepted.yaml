id: ap2-valid-direct-mandate-accepted
title: User-signed closed Checkout Mandate bound to this checkout is accepted with a signed receipt
purpose: >
  Human-present mode. The merchant verifies the chain, the checkout_hash binding, and its own
  Checkout JWT, returns a Success receipt whose reference hashes the received presentation, and
  completes the checkout exactly once.
classification: protocol_conformance
profile: ap2-mandates-v0.2.0
role: shopping_agent
requirement: LAB-AP2-VER-001
requires_capabilities: ["role:merchant", "mandate:mandate.checkout.1"]
preconditions: [fixture_reset, issuer_ready, result_lookup_supported]
steps:
  - id: create
    action: create_checkout_session
  - id: sign
    action: obtain_checkout_jwt
  - id: build
    action: build_checkout_mandate
    with: {variant: valid_direct}
  - id: present
    action: present_checkout_mandate
assertions:
  - kind: verifier
    step: present
    result: Success
  - kind: oracle
    oracle: ap2_receipt_signature_valid
    step: present
  - kind: oracle
    oracle: ap2_receipt_reference_matches
    step: present
  - kind: oracle
    oracle: ap2_receipt_schema_valid
    step: present
  - kind: oracle
    oracle: ap2_checkout_binding_independent
    step: present
  - kind: metric
    metric: merchant_order_count_for_operation
    equals: 1
evidence: [redacted_protocol_trace, verifier_decision, merchant_order_snapshot]
cleanup: reset_fixture
