id: ap2-unknown-constraint-unresolved
title: Open mandate with an unknown constraint type yields unresolved_constraint
purpose: Any unknown constraint MUST be treated as failing evaluation; the receipt error is unresolved_constraint.
classification: protocol_conformance
profile: ap2-mandates-v0.2.0
role: shopping_agent
requirement: LAB-AP2-VER-003
requires_capabilities: ["role:merchant", "mandate:mandate.checkout.open.1"]
preconditions: [fixture_reset, issuer_ready]
steps:
  - id: create
    action: create_checkout_session
  - id: sign
    action: obtain_checkout_jwt
  - id: build
    action: build_checkout_mandate
    with: {variant: unknown_constraint}
    intentionally_invalid: true
  - id: present
    action: present_checkout_mandate
assertions:
  - kind: verifier
    step: present
    result: Error
    error: unresolved_constraint
evidence: [redacted_protocol_trace, verifier_decision]
cleanup: reset_fixture
