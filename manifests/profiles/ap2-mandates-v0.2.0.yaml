id: ap2-mandates-v0.2.0
protocol: ap2
release: v0.2.0
status: tagged_release
description: >
  Agent Payments Protocol v0.2.0 mandate chains: Checkout Mandate (merchant verifier) and
  Payment Mandate (credential-provider verifier) as SD-JWT key-binding chains, in both
  human-present (closed mandate signed by the user) and autonomous (open mandate with cnf
  → agent-signed closed mandate) modes, with transaction binding through checkout_hash.
