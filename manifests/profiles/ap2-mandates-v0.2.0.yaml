roles:
  lab: shopping_agent
  target: merchant_and_credential_provider
transport: sd-jwt-presentation
capabilities:
  required:
    - id: role:merchant
      description: Target verifies Checkout Mandates and returns Checkout Receipts.
      discovery: "GET /ap2/capabilities roles contains 'merchant'"
    - id: mandate:mandate.checkout.1
      description: Closed Checkout Mandate type accepted.
      discovery: "mandate_types contains mandate.checkout.1"
  optional:
    - id: role:credential_provider
      description: Target verifies Payment Mandates and returns Payment Receipts.
      discovery: "roles contains 'credential_provider'"
    - id: mandate:mandate.checkout.open.1
      description: Open Checkout Mandates (autonomous mode) accepted.
      discovery: "mandate_types contains mandate.checkout.open.1"
    - id: mandate:mandate.payment.1
      description: Closed Payment Mandate type accepted.
      discovery: "mandate_types contains mandate.payment.1"
    - id: mandate:mandate.payment.open.1
      description: Open Payment Mandates accepted.
      discovery: "mandate_types contains mandate.payment.open.1"
driver: ap2
lab_decisions:
  - "AP2 v0.2.0 defines mandate structures and verification rules but no REST binding for presenting them; /ap2/* endpoints are lab application endpoints."
  - "The chain root is a test-issuer SD-JWT user credential (vct urn:commerce-lab:user-credential:1) whose cnf key signs the first kb+sd-jwt link; this models the Trusted Surface credential the spec references but does not fix."
  - "Receipt `reference` is computed as the sd_hash-style hash over the full presentation string received."
  - "Allowed JWS algorithms are ES256 and EdDSA; the merchant Checkout JWT must be ES256 (spec: not a deterministic signature scheme)."
  - "Constraint amounts are compared in ISO 4217 minor units per the pinned open_payment_mandate.json (the prose example uses decimals)."
