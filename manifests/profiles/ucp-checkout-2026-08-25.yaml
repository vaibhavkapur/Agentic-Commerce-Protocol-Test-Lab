transport: rest
capabilities:
  required:
    - id: dev.ucp.shopping.checkout
      description: Checkout capability advertised in the business profile.
      discovery: "/.well-known/ucp ucp.capabilities has key dev.ucp.shopping.checkout"
    - id: service:dev.ucp.shopping:rest
      description: Shopping service with a REST transport binding and endpoint.
      discovery: "ucp.services['dev.ucp.shopping'][transport=rest].endpoint present"
  optional:
    - id: dev.ucp.shopping.discount
      description: Discount extension (discount codes, applied/rejected discounts).
      discovery: "ucp.capabilities has key dev.ucp.shopping.discount"
driver: ucp
lab_decisions:
  - "Idempotency-Key is required by the REST OpenAPI parameter definition, while the prose says operations SHOULD support idempotency; the lab asserts the replay/409-conflict contract only for targets that accept the header."
  - "Business-outcome errors (out_of_stock, payment_failed) are HTTP 200 with a messages[] entry; protocol errors use the error_response envelope."
  - "The Complete Checkout lost-response recovery follows the spec text: GET first, and only re-send the identical request with the same idempotency key if GET cannot establish the outcome."
