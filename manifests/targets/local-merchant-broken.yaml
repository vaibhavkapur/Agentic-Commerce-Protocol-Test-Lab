id: local-merchant-broken
description: >
  Deliberately broken reference implementation. Ignores Idempotency-Key, charges the processor
  before checking session state (double charge on a retried completion), returns legacy error
  bodies, trusts caller-supplied X-Forwarded-Host in TAP verification, has no replay cache, and
  authenticates AP2 mandate chains without checking they are bound to the checkout being completed.
kind: local_reference
revision: reference_targets.broken@0.1.0
